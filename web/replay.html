<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回看 — 红十</title>
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/card.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #165a23;
  font-family: "Arial Unicode MS", "PingFang SC", "Heiti SC", "Microsoft YaHei", Arial, sans-serif;
  color: #e1e4d7; }

/* ── App shell ──────────────────────────────────────────────────────────── */
#app { height: 100vh; display: grid;
  grid-template: "main panel" 1fr "ctrl ctrl" 48px / 1fr 260px; }

#main { grid-area: main; position: relative; background: #105a1a; overflow: hidden; }

#panel { grid-area: panel; background: #0c2c14; border-left: 2px solid #2d6e37;
  display: flex; flex-direction: column; padding: 8px 10px 6px; overflow: hidden; }
#panel h2 { font-size: 14px; text-align: center; color: #e1e4d7;
  border-bottom: 1px solid #2d6e37; padding-bottom: 6px; margin-bottom: 6px; }
#score-table { font-size: 12px; font-family: monospace; line-height: 1.7; }
#score-table .row { display: flex; justify-content: space-between; }
#evlog-label { font-size: 10px; color: #829672; margin-top: 8px; margin-bottom: 3px; }
#evlog { flex: 1; overflow: hidden; font-size: 10px; font-family: monospace; line-height: 1.55; }
#evlog .ev { color: #829672; }
#evlog .ev.cur { color: #ffe42d; }

#ctrl { grid-area: ctrl; background: #0c2414; border-top: 2px solid #2d6e37;
  display: flex; align-items: center; gap: 6px; padding: 0 14px; }
.btn { background: #285a34; border: 1px solid #468850; border-radius: 6px;
  color: #e1e4d7; font-size: 12px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: #3c7e48; }
.btn.active { background: #58be64; color: #0c1a10; }
#speed-lbl { font-size: 11px; color: #829672; margin-left: 6px; }
#ev-lbl    { font-size: 11px; color: #829672; margin-left: auto; }

/* ── Selector overlay ───────────────────────────────────────────────────── */
#sel-overlay { position: absolute; inset: 0; background: rgba(10,30,14,0.92);
  display: flex; align-items: center; justify-content: center; z-index: 100; }
#sel-box { background: #0c2c14; border: 2px solid #ffe42d; border-radius: 12px;
  padding: 24px 32px; min-width: 340px; max-width: 440px; max-height: 80vh; overflow-y: auto; }
#sel-box h1 { font-size: 18px; color: #ffe42d; margin-bottom: 16px; text-align: center; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: #829672; margin-bottom: 3px; }
.field select, .field input { width: 100%; background: #162c1c; border: 1px solid #3a6a44;
  border-radius: 5px; color: #e1e4d7; padding: 6px 10px; font-size: 13px; }
.sess-item { padding: 6px 8px; margin-bottom: 4px; background: #162c1c; border-radius: 5px;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.sess-item:hover { background: #1e3c26; }
.sess-item .meta { font-size: 10px; color: #829672; }
.back-link { font-size: 11px; color: #829672; cursor: pointer; margin-bottom: 8px; display: inline-block; }
.back-link:hover { color: #ffe42d; }

.card.highlight { outline: 2px solid #ffe42d; }

/* ── Seats ──────────────────────────────────────────────────────────────── */
.seat { position: absolute; transform: translate(-50%,-50%);
  background: #122a18; border: 2px solid #556; border-radius: 8px;
  padding: 5px 7px 4px; min-width: 160px; }
.seat.anchor-left  { transform: translate(0, -50%); }
.seat.anchor-right { transform: translate(-100%, -50%); }
.seat.leader { border-color: #ffe42d; }
.seat.red    { border-color: #dc4848; }
.seat.nonred { border-color: #589bdc; }
.seat-name { font-size: 11px; display: flex; justify-content: space-between; margin-bottom: 3px; }
.seat-score { font-size: 10px; color: #829672; margin-bottom: 3px; display: flex; justify-content: space-between; }
.seat-cards { display: flex; flex-wrap: nowrap; min-height: 52px; align-items: flex-end; --cml: -22px; }
.seat-cards .card { margin-left: var(--cml); }
.seat-cards .card:first-child { margin-left: 0 !important; }

/* ── Trick zone ─────────────────────────────────────────────────────────── */
#trick-zone { position: absolute; transform: translate(-50%,-50%); pointer-events: none; }
.trick-slot { position: absolute; transform: translate(-50%,-50%); }
.trick-slot .card { margin-left: -18px; }
.trick-slot .card:first-child { margin-left: 0; }
.trick-slot .slot-label { font-size: 10px; color: #829672; text-align: center; margin-top: 2px; }
.trick-slot.winner .card { outline: 2px solid #ffaf00; }

/* ── Annotation ─────────────────────────────────────────────────────────── */
#annotation { position: absolute; text-align: center; pointer-events: none;
  font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

/* ── Hand-end overlay ───────────────────────────────────────────────────── */
#hand-overlay { display: none; position: absolute; background: rgba(8,36,12,0.94);
  border: 2px solid #ffe42d; border-radius: 12px; padding: 16px 22px;
  font-size: 13px; z-index: 50; min-width: 280px; }
#hand-overlay h3 { color: #ffe42d; margin-bottom: 8px; font-size: 16px; }
#hand-overlay .team-row { margin-bottom: 4px; }
#hand-overlay .p-row { font-size: 12px; color: #829672; }

.pause-overlay {
  display: none; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); z-index: 25; font-size: 28px; font-weight: bold;
  color: #ffe42d; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); pointer-events: none;
  background: rgba(0,0,0,0.5); padding: 8px 24px; border-radius: 8px;
}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <!-- Session/hand selector -->
    <div id="sel-overlay">
      <div id="sel-box">
        <span class="back-link" onclick="location.href='/'">← 返回首页</span>
        <h1>回看训练对局</h1>
        <div id="sel-content">
          <div class="field">
            <label>训练 Session</label>
            <select id="sel-session" onchange="onSessionChange()">
              <option value="">— 加载中… —</option>
            </select>
          </div>
          <div class="field" id="hand-field" style="display:none;">
            <label>手牌</label>
            <select id="sel-hand" onchange="onHandChange()"></select>
          </div>
          <div class="field" id="rep-field" style="display:none;">
            <label>重复次数</label>
            <select id="sel-rep"></select>
          </div>
          <button class="btn" id="load-btn" onclick="loadReplay()" style="width:100%;display:none;">▶ 加载回放</button>
        </div>
      </div>
    </div>

    <div id="trick-zone"></div>
    <div id="seats"></div>
    <div id="annotation"></div>
    <div id="hand-overlay"></div>
    <div class="pause-overlay" id="pause-indicator">⏸ PAUSED</div>
  </div>

  <div id="panel">
    <h2>Score Board</h2>
    <div id="score-table"></div>
    <div id="evlog-label">Event log</div>
    <div id="evlog"></div>
  </div>

  <div id="ctrl">
    <button class="btn" id="btn-restart" onclick="replayRestart()">⏮</button>
    <button class="btn" id="btn-prev"    onclick="replayStep(-1)">◀</button>
    <button class="btn" id="btn-play"    onclick="replayToggle()">▶ Play</button>
    <button class="btn" id="btn-next"    onclick="replayStep(1)">▶</button>
    <button class="btn" id="btn-slower"  onclick="replaySpeed(1)">🐢</button>
    <button class="btn" id="btn-faster"  onclick="replaySpeed(-1)">🐇</button>
    <span id="speed-lbl">700ms</span>
    <span id="ev-lbl">—</span>
    <button class="btn" style="margin-left:auto" onclick="showSelector()">选择对局</button>
  </div>
</div>

<script type="module">
import { cardHtml as _cardHtml, backCardHtml as _backCardHtml, sortedHand as _sortedHand } from '/src/lib/card.js';
window._cardHtml = _cardHtml;
window._backCardHtml = _backCardHtml;
window._sortedHand = _sortedHand;
</script>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let events = [];
let evIdx = 0;
let playing = false;
let timer = null;
let rePaused = false;
let rePauseBuffer = [];
const SPEEDS = [2000, 1200, 700, 400, 200, 100];
let speedIdx = 2;
const TRICK_OFF = [[0,100],[-110,65],[-130,-12],[0,-100],[130,-12],[110,65]];
let sessions = [];

// ── Session selector ──────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const res = await fetch('/api/training/sessions');
    sessions = await res.json();
    const sel = document.getElementById('sel-session');
    sel.innerHTML = '<option value="">— 选择 Session —</option>';
    sessions.forEach(s => {
      sel.innerHTML += `<option value="${s.id}">${s.id}  (${s.hands}手×${s.reps}次, ${s.elapsed_s ? Math.round(s.elapsed_s/60)+'min' : '?'})</option>`;
    });
    if (!sessions.length) {
      sel.innerHTML = '<option value="">— 无训练记录 —</option>';
    }
  } catch(e) {
    console.error(e);
  }
}

let currentSessionMeta = null;

async function onSessionChange() {
  const sid = document.getElementById('sel-session').value;
  if (!sid) { hideSelectors(); return; }
  try {
    const res = await fetch(`/api/training/session/${sid}`);
    currentSessionMeta = await res.json();
    const hands = currentSessionMeta.hands || [];
    const hsel = document.getElementById('sel-hand');
    hsel.innerHTML = '<option value="">— 选择手牌 —</option>';
    hands.forEach(h => {
      hsel.innerHTML += `<option value="${h.name}">${h.name} (${h.reps.length} reps)</option>`;
    });
    document.getElementById('hand-field').style.display = 'block';
    document.getElementById('rep-field').style.display = 'none';
    document.getElementById('load-btn').style.display = 'none';
  } catch(e) {
    console.error(e);
  }
}

function onHandChange() {
  const hname = document.getElementById('sel-hand').value;
  if (!hname || !currentSessionMeta) {
    document.getElementById('rep-field').style.display = 'none';
    document.getElementById('load-btn').style.display = 'none';
    return;
  }
  const hand = currentSessionMeta.hands.find(h => h.name === hname);
  if (!hand) return;
  const rsel = document.getElementById('sel-rep');
  rsel.innerHTML = hand.reps.map(r =>
    `<option value="${r}">${r}</option>`
  ).join('');
  document.getElementById('rep-field').style.display = 'block';
  document.getElementById('load-btn').style.display = 'block';
}

function hideSelectors() {
  document.getElementById('hand-field').style.display = 'none';
  document.getElementById('rep-field').style.display = 'none';
  document.getElementById('load-btn').style.display = 'none';
}

function showSelector() {
  stopTimer();
  playing = false;
  updatePlayBtn();
  document.getElementById('sel-overlay').style.display = 'flex';
}

async function loadReplay() {
  const sid = document.getElementById('sel-session').value;
  const hid = document.getElementById('sel-hand').value;
  const rid = document.getElementById('sel-rep').value;
  if (!sid || !hid || !rid) return;

  try {
    const res = await fetch(`/api/training/session/${sid}/hand/${hid}/rep/${rid}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    events = data.events || [];
  } catch(e) {
    alert('加载失败: ' + e.message);
    return;
  }

  if (!events.length) { alert('无事件数据'); return; }

  document.getElementById('sel-overlay').style.display = 'none';
  evIdx = 0;
  playing = false;
  rePaused = false;
  stopTimer();
  buildReplaySeats();
  buildReplayTrickZone();
  renderReplay();
  replayToggle();
  // Update URL
  const url = new URL(location);
  url.searchParams.set('session', sid);
  url.searchParams.set('hand', hid);
  url.searchParams.set('rep', rid);
  history.replaceState(null, '', url);
}

// ── Replay controls ───────────────────────────────────────────────────────
function replayStep(dir) {
  evIdx = Math.max(0, Math.min(events.length - 1, evIdx + dir));
  renderReplay();
}

function replayRestart() {
  stopTimer();
  playing = false;
  evIdx = 0;
  renderReplay();
  updatePlayBtn();
}

function replayToggle() {
  playing = !playing;
  if (playing) startTimer(); else stopTimer();
  updatePlayBtn();
}

function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    if (evIdx >= events.length - 1) { stopTimer(); playing = false; updatePlayBtn(); return; }
    evIdx++;
    renderReplay();
    const ev = events[evIdx];
    if (ev.kind === 'hand_end') { stopTimer(); playing = false; updatePlayBtn(); }
  }, SPEEDS[speedIdx]);
}

function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function replaySpeed(dir) {
  speedIdx = Math.max(0, Math.min(SPEEDS.length - 1, speedIdx + dir));
  document.getElementById('speed-lbl').textContent = SPEEDS[speedIdx] + 'ms';
  if (playing) startTimer();
}

function updatePlayBtn() {
  const btn = document.getElementById('btn-play');
  btn.textContent = playing ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active', playing);
}

// ── DOM builders ──────────────────────────────────────────────────────────
function buildReplaySeats() {
  const el = document.getElementById('seats');
  el.innerHTML = '';
  for (let p = 0; p < 6; p++) {
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.id = 'rseat-' + p;
    seat.innerHTML = `<div class="seat-name">
        <span class="sname">P${p}</span>
        <span class="id-badge" id="rbadge-${p}"></span>
      </div>
      <div class="seat-score">
        <span id="rsc-hand-${p}">hand 0</span>
        <span id="rsc-cum-${p}">total 0</span>
      </div>
      <div class="seat-cards" id="rhand-${p}"></div>`;
    el.appendChild(seat);
  }
  positionReplaySeats();
}

function positionReplaySeats() {
  const main = document.getElementById('main');
  const W = main.clientWidth, H = main.clientHeight;
  const pos = [[0.50,0.88],[0.02,0.72],[0.02,0.35],[0.50,0.09],[0.98,0.35],[0.98,0.72]];
  for (let p = 0; p < 6; p++) {
    const seat = document.getElementById('rseat-' + p);
    if (seat) {
      seat.style.left = (pos[p][0] * 100) + '%';
      seat.style.top = (pos[p][1] * 100) + '%';
      seat.classList.remove('anchor-left', 'anchor-right');
      if (p === 1 || p === 2) seat.classList.add('anchor-left');
      if (p === 4 || p === 5) seat.classList.add('anchor-right');
    }
  }
}

function buildReplayTrickZone() {
  const tz = document.getElementById('trick-zone');
  tz.innerHTML = '';
  for (let p = 0; p < 6; p++) {
    const slot = document.createElement('div');
    slot.className = 'trick-slot';
    slot.id = 'rtslot-' + p;
    slot.innerHTML = `<div class="slot-cards" id="rtcards-${p}"></div>
                      <div class="slot-label">P${p}</div>`;
    tz.appendChild(slot);
  }
  positionReplayTrickZone();
}

function positionReplayTrickZone() {
  const main = document.getElementById('main');
  const W = main.clientWidth, H = main.clientHeight;
  const tz = document.getElementById('trick-zone');
  if (tz) { tz.style.left = (W * 0.5) + 'px'; tz.style.top = (H * 0.5) + 'px'; }
  const scale = Math.min(W / 1400, H / 900);
  for (let p = 0; p < 6; p++) {
    const slot = document.getElementById('rtslot-' + p);
    if (slot) { slot.style.left = (TRICK_OFF[p][0] * scale) + 'px'; slot.style.top = (TRICK_OFF[p][1] * scale) + 'px'; }
  }
}

// ── Card HTML (delegates to shared module) ────────────────────────────────
function cardHtml(c, highlight) {
  let html = window._cardHtml?.(c) || '';
  if (highlight && html) {
    html = html.replace('class="card', 'class="card highlight');
  }
  return html;
}

// ── Main render ───────────────────────────────────────────────────────────
function renderReplay() {
  if (!events.length) return;
  const ev = events[evIdx];
  const snap = ev.snap;

  // Detect leader
  let leader = null;
  for (let i = evIdx; i >= 0; i--) {
    if (events[i].kind === 'hand_start' || events[i].kind === 'deal') break;
    if (events[i].kind === 'lead') { leader = events[i].player; break; }
  }

  for (let p = 0; p < 6; p++) {
    const seat = document.getElementById('rseat-' + p);
    if (!seat || !snap) continue;
    const hand = snap.hands[p] || [];
    const ident = snap.ids ? snap.ids[p] : null;
    const done = snap.fin ? snap.fin[p] : false;

    const anchorCls = p === 1 || p === 2 ? ' anchor-left' : p === 4 || p === 5 ? ' anchor-right' : '';
    seat.className = 'seat' + anchorCls;
    if (p === leader) seat.classList.add('leader');
    else if (ident === 'Red') seat.classList.add('red');
    else if (ident === 'Non-Red') seat.classList.add('nonred');

    const nameEl = seat.querySelector('.sname');
    const badgeEl = seat.querySelector('.id-badge');
    let name = `P${p}`;
    if (done && snap.fo) {
      const pos = snap.fo.indexOf(p);
      name += pos === 0 ? ' 大贡' : pos === snap.fo.length - 1 ? ' 末贡' : ` #${pos+1}`;
    }
    if (nameEl) nameEl.textContent = name;

    if (badgeEl) {
      if (ident === 'Red') { badgeEl.textContent = '♥ Red'; badgeEl.style.color = '#dc4848'; }
      else if (ident === 'Non-Red') { badgeEl.textContent = '○'; badgeEl.style.color = '#589bdc'; }
      else { badgeEl.textContent = ''; badgeEl.style.color = '#888'; }
    }

    if (snap.ts && snap.cs) {
      const hEl = document.getElementById('rsc-hand-' + p);
      const cEl = document.getElementById('rsc-cum-' + p);
      if (hEl) hEl.textContent = 'hand ' + (snap.ts[p] || 0);
      if (cEl) cEl.textContent = 'total ' + (snap.cs[p] || 0);
    }

    const cardsEl = document.getElementById('rhand-' + p);
    if (cardsEl) {
      const n = hand.length;
      let ml = -22;
      if (n > 1) {
        const vis = Math.max(5, (260 - 36) / (n - 1));
        ml = Math.min(-6, -(36 - vis));
      }
      cardsEl.style.setProperty('--cml', ml + 'px');
      cardsEl.innerHTML = hand.map(c => cardHtml(c, false)).join('');
    }
  }

  // Trick zone
  for (let p = 0; p < 6; p++) {
    const el = document.getElementById('rtcards-' + p);
    if (el) el.innerHTML = '';
  }
  if (snap && snap.tp) {
    const winnerP = snap.tw;
    for (const [p, move] of snap.tp) {
      if (!move || move.pass) continue;
      const slot = document.getElementById('rtslot-' + p);
      const cardsEl = document.getElementById('rtcards-' + p);
      if (slot) slot.className = 'trick-slot' + (p === winnerP ? ' winner' : '');
      if (cardsEl && move.cards) {
        cardsEl.innerHTML = move.cards.map(c => cardHtml(c, p === winnerP)).join('');
      }
    }
  }

  // Annotation
  const ann = document.getElementById('annotation');
  const IMPORTANT = new Set(['reveal','guan_ren','san_hong_shi','hand_end','finish','gui_zhu','mo_gong','trick_end']);
  if (IMPORTANT.has(ev.kind)) {
    const main = document.getElementById('main');
    const tzEl = document.getElementById('trick-zone');
    ann.textContent = ev.desc;
    ann.style.color = ev.kind === 'reveal' ? '#ffe42d' :
      ev.kind === 'finish' ? '#4bc84b' :
      ev.kind === 'trick_end' && ev.pts > 0 ? '#ffe42d' :
      ev.kind.includes('gong') || ev.kind === 'guan_ren' ? '#ffaf00' : '#e1e4d7';
    ann.style.left = '0';
    ann.style.right = '260px';
    ann.style.top = ((parseInt(tzEl?.style.top) || main.clientHeight * 0.5) + 120 + 6) + 'px';
  } else {
    ann.textContent = '';
  }

  // Hand-end overlay
  const overlay = document.getElementById('hand-overlay');
  if (ev.kind === 'hand_end' && ev.result && snap) {
    const r = ev.result;
    const tnames = { NORMAL: 'Normal', GUAN_REN: '★★ 关人！', SAN_HONG_SHI: '★★★ 3红十！' };
    let html = `<h3>Hand ${snap.hn || '?'} Result</h3>
      <div style="color:#ffaf00;margin-bottom:8px">${tnames[r.terminal] || r.terminal}</div>
      <div class="team-row" style="color:#dc4848">Red Team: ${r.team_pts?.RED || '?'} pts</div>
      <div class="team-row" style="color:#589bdc;margin-bottom:8px">Non-Red Team: ${r.team_pts?.NON_RED || '?'} pts</div>`;
    for (let p = 0; p < 6; p++) {
      const isRed = r.red ? r.red.includes(p) : false;
      const pos = snap.fo ? snap.fo.indexOf(p) : -1;
      const posLbl = pos === 0 ? ' 大贡' : pos === snap.fo?.length - 1 ? ' 末贡' : pos >= 0 ? ` #${pos+1}` : '';
      html += `<div class="p-row" style="color:${isRed ? '#dc4848' : '#589bdc'}">P${p}${posLbl} — ${r.scores ? r.scores[p] : '?'} pts</div>`;
    }
    html += `<div style="font-size:11px;color:#829672;margin-top:10px">Press Space or → to continue</div>`;
    overlay.innerHTML = html;
    overlay.style.display = 'block';
    const main = document.getElementById('main');
    const ow = Math.min(320, main.clientWidth * 0.38);
    overlay.style.width = ow + 'px';
    overlay.style.left = (main.clientWidth / 2 - ow / 2) + 'px';
    overlay.style.top = (main.clientHeight / 2 - overlay.offsetHeight / 2) + 'px';
  } else if (ev.kind !== 'hand_end') {
    overlay.style.display = 'none';
  }

  // Score panel
  if (snap) {
    const scoreEl = document.getElementById('score-table');
    let sh = '<div class="row" style="color:#829672;font-size:10px"><span class="pname">Player</span><span class="pts">Hand</span><span class="pts">Total</span></div>';
    for (let p = 0; p < 6; p++) {
      const ident = snap.ids ? snap.ids[p] : null;
      const col = ident === 'Red' ? '#dc4848' : ident === 'Non-Red' ? '#589bdc' : '#e1e4d7';
      const fin = snap.fin && snap.fin[p] ? ' ✓' : '';
      sh += `<div class="row" style="color:${col}">
        <span class="pname">P${p}${fin}</span>
        <span class="pts">${snap.ts ? snap.ts[p] : 0}</span>
        <span class="pts">${snap.cs ? snap.cs[p] : 0}</span>
      </div>`;
    }
    scoreEl.innerHTML = sh;
  }

  // Event log
  const logEl = document.getElementById('evlog');
  const lineH = 16;
  const vis = Math.max(4, Math.floor(logEl.clientHeight / lineH));
  const start = Math.max(0, evIdx - vis + 1);
  const end = Math.min(events.length, start + vis);
  let lh = '';
  for (let i = start; i < end; i++) {
    const cls = i === evIdx ? 'ev cur' : 'ev';
    lh += `<div class="${cls}">${(events[i].desc || '').slice(0, 46)}</div>`;
  }
  logEl.innerHTML = lh;

  document.getElementById('ev-lbl').textContent = `Event ${evIdx + 1} / ${events.length}`;
  document.getElementById('speed-lbl').textContent = SPEEDS[speedIdx] + 'ms';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const selVisible = document.getElementById('sel-overlay').style.display !== 'none';
  if (selVisible) return;
  if (e.code === 'Space') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    rePaused = !rePaused;
    document.getElementById('pause-indicator').style.display = rePaused ? 'block' : 'none';
    if (!rePaused) replayToggle();
  } else if (e.key === 'ArrowRight') replayStep(1);
  else if (e.key === 'ArrowLeft') replayStep(-1);
  else if (e.key === 'ArrowUp') replaySpeed(-1);
  else if (e.key === 'ArrowDown') replaySpeed(1);
  else if (e.key === 'r' || e.key === 'R') replayRestart();
  else if (e.key === 'n' || e.key === 'N') showSelector();
});

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  positionReplaySeats();
  positionReplayTrickZone();
  if (events.length) renderReplay();
});

// ── Init ──────────────────────────────────────────────────────────────────
updatePlayBtn();
loadSessions();

// Check for URL params
(function() {
  const p = new URLSearchParams(location.search);
  const s = p.get('session'), h = p.get('hand'), r = p.get('rep');
  if (s && h && r) {
    document.getElementById('sel-session').value = s;
    onSessionChange().then(() => {
      document.getElementById('sel-hand').value = h;
      onHandChange();
      document.getElementById('sel-rep').value = r;
      loadReplay();
    });
  }
})();
</script>
</body>
</html>
